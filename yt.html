<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Dungeon Descent YouTube player</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<!--
  The iPhone app runs from capacitor://localhost, which sends YouTube no
  referrer, and YouTube now refuses to play without one ("Video player
  configuration error", error 153). The app embeds this page instead, so
  YouTube sees a normal https://dungen-descent.org referrer.
  Usage: /yt.html?v=VIDEO_ID&autoplay=1
-->
<script>
(function() {
  var q = new URLSearchParams(location.search);
  var v = (q.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20);
  if (!v) { document.body.textContent = 'No video.'; return; }
  var src = 'https://www.youtube-nocookie.com/embed/' + v +
    '?loop=1&playlist=' + v + '&controls=1&modestbranding=1&rel=0&playsinline=1' +
    (q.get('autoplay') === '1' ? '&autoplay=1' : '') +
    '&origin=' + encodeURIComponent(location.origin);
  var f = document.createElement('iframe');
  f.src = src;
  f.title = 'YouTube player';
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allowFullscreen = true;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
